# This is a basic workflow to help you get started with Actions

name: Publish Chocolatey Package
run-name: Publish ${{ inputs.tag || github.ref_name }} to Chocolatey

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    tags: [ '*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and push (e.g. 6.18.27687)'
        required: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display Version (debug)
        run: echo "Trying to use version $TAG"

      - name: Find and Replace Version
        run: find . -name "*.nuspec" -type f -exec sed -i "s/#{VERSION}#/$TAG/g" {} \;

      - name: Choco Pack
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: pack --allow-unofficial
          
      - name: Choco Push
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: push axis-camera-station-pro-client.${{ env.TAG }}.nupkg --source "https://push.chocolatey.org/" --api-key "${{ secrets.CHOCO_API_KEY }}" --allow-unofficial
